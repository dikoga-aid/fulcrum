# -------------------------------------------------------------------
# Render Blueprint -- QA-ONLY resources for VOL-4 (Fulcrum Spike)
#
# This Blueprint provisions QA-ONLY resources. It does NOT reference
# or modify any production service/database. Committing this file
# deploys NOTHING -- Preparador instantiates the Blueprint in Render
# after the human prerequisites (GitHub repo transfer by Koga,
# secret values supplied by Koga) are satisfied.
# -------------------------------------------------------------------

services:
  - type: web
    name: fulcrum-qa
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:push -- --force && npm run migrate
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fulcrum-qa-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HUBSPOT_API_KEY
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: OKTA_ISSUER
        sync: false
      - key: OKTA_CLIENT_ID
        sync: false
      - key: OKTA_CLIENT_SECRET
        sync: false
      - key: OKTA_CALLBACK_URL
        sync: false

databases:
  - name: fulcrum-qa-db
    databaseName: fulcrum_qa
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: []
